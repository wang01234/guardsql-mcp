services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: guardsql
      POSTGRES_PASSWORD: guardsql
      POSTGRES_DB: guardsql
    ports:
      - "5432:5432"
    volumes:
      # Mounted into the initdb directory: applied automatically on first start.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardsql -d guardsql"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://guardsql:guardsql@postgres:5432/guardsql
      GUARDSQL_CONFIG: /app/config/guardsql.yaml
      DEMO_READONLY_TOKEN: ${DEMO_READONLY_TOKEN:-readonly-demo-token-change-me}
      DEMO_OPS_TOKEN: ${DEMO_OPS_TOKEN:-ops-demo-token-change-me}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-demo-token-change-me}
    ports:
      - "8787:8787"

volumes:
  pgdata:
